    <script>
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000)); // Convert days to milliseconds
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + value + expires + "; path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        window.addEventListener("load", function () {
            if (getCookie("cookieConsent")) {
                console.log("Cookie consent already given. No banner shown.");
                return;
            }

            window.cookieconsent.initialise({
                "palette": {
                    "popup": { "background": "#000" },
                    "button": { "background": "#f1d600" }
                },
                "theme": "classic",
                "content": {
                    "message": "This website uses cookies to improve your experience.",
                    "deny": "Deny",
                    "dismiss": "Allow only essentials",
                    "allow": "Allow all",
                    "link": "Learn more",
                    "href": "privacy-policy.html"
                },
                "type": "opt-in",
                "layout": "basic",
                "elements": {
                    "messagelink": '<span id="cookieconsent:desc" class="cc-message">{{message}} <a aria-label="learn more about cookies" tabindex="0" class="cc-link" href="{{href}}" target="_blank">{{link}}</a></span>',
                    "deny": '<button type="button" class="cc-btn cc-deny">{{deny}}</button>',
                    "dismiss": '<button type="button" class="cc-btn cc-dismiss">{{dismiss}}</button>',
                    "allow": '<button type="button" class="cc-btn cc-allow">{{allow}}</button>'
                },
                "compliance": {
                    "info": '<div class="cc-compliance">{{dismiss}}</div>',
                    "opt-in": '<div class="cc-compliance cc-highlight">{{deny}}{{dismiss}}{{allow}}</div>'
                },
                "onInitialise": function (status) {
                    applyCookieChoice(status);
                },
                "onStatusChange": function (status) {
                    applyCookieChoice(status);
                },
                "onRevokeChoice": function () {
                    disableCookies();
                }
            });

            function applyCookieChoice(status) {
                if (status === "allow") {
                    enableAllCookies();
                    setCookie("cookieConsent", "allow", 365);
                } else if (status === "dismiss") {
                    enableEssentialCookies();
                    setCookie("cookieConsent", "essential", 365);
                } else {
                    disableCookies();
                    setCookie("cookieConsent", "deny", 365);
                }
            }

            function enableAllCookies() {
                console.log("All cookies enabled.");
                // Here, you can enable Google Analytics, Ads, etc.
            }

            function enableEssentialCookies() {
                console.log("Only essential cookies enabled.");
                // Here, allow only functional session cookies
            }

            function disableCookies() {
                console.log("Cookies disabled.");
                // Block all non-essential cookies
            }
        });
    </script>
