<!doctype html>

<html lang="pl">

<head>
  <meta charset="utf-8">
  <title>Dokumenty</title>
<link rel="icon" href="media/favicon.webp">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
  <link rel="stylesheet" href="css/documents.css">
  <script src="https://code.jquery.com/jquery-3.3.1.js"
    integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60=" crossorigin="anonymous"></script>
  <script> 
  $(function(){
  $("#header").load("header.html"); 
  $("#footer").load("footer.html"); 
  });
  </script>
</head>

<body>
  <div id="header"></div>
  <div class="position-relative overflow-hidden text-reg welcome-background">
    <div class="container-xl welcome-section">
      <h1 id="welcome-title" class="mb-4">Dokumenty</h1>
    </div>
  </div>

    <div class="overflow-hidden bg-light text-reg ">
      <div class="container-xl document-container">        
          <h1 class="s1-title my-5 ">Dokumenty do pobrania</h1>
          <p class="sub">Przedstawiamy dokumentację dotyczącą naszej firmy.<br>
             (Kliknij plik, aby pobrać)</p>
          <div class="row row-cols-4 justify-content-between">
            <div class="col my-5">              
                <div class="document-box rounded border">
                  <a href="/docs/regon.pdf" style="text-decoration: none;" download="REGON.pdf" >
                  <div class="row row-cols-2 px-5 py-3">
                    <div class="col">
                      <h1 class="tabs-title my-3">Regon</h1>
                    </div>
                    <div class="col">                      
                        <img class="ms-4" src="media/carbon_document-download.svg" width="60" height="60">                                           
                    </div>
                  </div>
                </a>
                </div>   
            </div>
            <div class="col my-5">
              <div class="document-box rounded border">
                <a href="/docs/krs.pdf" style="text-decoration: none;" download="KRS.pdf">
                <div class="row row-cols-2 px-5 py-3">
                  <div class="col">
                    <h1 class="tabs-title my-3">KRS</h1>
                  </div>
                  <div class="col">
                    <img class="ms-4" src="media/carbon_document-download.svg" width="60" height="60">
                  </div>
                </div>
              </a>
              </div>
            </div>
            <div class="col my-5">
              <div class="document-box rounded border">
                <a href="/docs/licencje.pdf" style="text-decoration: none;" download="LUKLOG_licencje.pdf" >
                <div class="row row-cols-2 px-4 py-3">
                  <div class="col">
                    <h1 class="tabs-title my-3">Licencje</h1>
                  </div>
                  <div class="col">
                    <img class="ms-4" src="media/carbon_document-download.svg" width="60" height="60">
                  </div>
                </div>
              </a>
              </div>
            </div>
          </div>                   
      </div>
    </div>


  <div id="footer"></div>


</body>

</html>
